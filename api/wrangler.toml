name = "microblog-api"
main = "src/index.ts"
compatibility_date = "2026-04-12"

# Default variables (used by wrangler dev)
[vars]
ENVIRONMENT = "development"
ALLOW_ADMIN_BOOTSTRAP = "true"
ALLOWED_ORIGINS = "http://localhost:3000,http://127.0.0.1:3000"
SESSION_SAME_SITE = "lax"

# D1 Database binding (local development)
[[d1_databases]]
binding = "DB"
database_name = "microblog-db-local"
database_id = "local"

[[r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "your-local-r2-bucket"

[[ratelimits]]
name = "ANALYTICS_RATE_LIMITER"
namespace_id = "10001"
simple = { limit = 6, period = 60 }

[[ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "10002"
simple = { limit = 5, period = 60 }

[env.production]
vars = { ENVIRONMENT = "production", ALLOW_ADMIN_BOOTSTRAP = "false", ALLOWED_ORIGINS = "https://your-pages-site.pages.dev", SESSION_SAME_SITE = "lax" }

[[env.production.d1_databases]]
binding = "DB"
database_name = "your-production-d1-database"
database_id = "your-production-d1-database-id"

[[env.production.r2_buckets]]
binding = "MEDIA_BUCKET"
bucket_name = "your-production-r2-bucket"

[[env.production.ratelimits]]
name = "ANALYTICS_RATE_LIMITER"
namespace_id = "10001"
simple = { limit = 6, period = 60 }

[[env.production.ratelimits]]
name = "LOGIN_RATE_LIMITER"
namespace_id = "10002"
simple = { limit = 5, period = 60 }

# Required secrets (set via wrangler secret put):
# - SESSION_SECRET
# - PROXY_SHARED_SECRET (must match the Pages secret of the same name)
# Optional weather secrets:
# - QWEATHER_PRIVATE_KEY
# - QWEATHER_KEY_ID
# - QWEATHER_PROJECT_ID
